name: Deploy

# staging    : automatically after CI succeeds on main
# production : on a version tag (v*) or manually; the `production` GitHub Environment should require an
#              approval (Settings -> Environments -> production -> Required reviewers).
#
# The deploy itself is infrastructure/scripts/deploy.sh (blue/green, migrations first, smoke test, automatic
# rollback) executed on the target host over SSH. Images are pulled from GHCR by the tag CI produced.
#
# Required per environment (Settings -> Environments -> <env> -> Secrets / Variables):
#   secrets:   DEPLOY_SSH_KEY, DEPLOY_KNOWN_HOSTS, SMOKE_EMAIL, SMOKE_PASSWORD (optional)
#   variables: DEPLOY_HOST, DEPLOY_USER, DEPLOY_PATH, PUBLIC_BASE_URL

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [staging, production]
        default: staging
      tag:
        description: Image tag to deploy (defaults to the commit's CI tag)
        required: false

permissions:
  contents: read
  packages: read

concurrency:
  group: deploy-${{ github.event.inputs.environment || (startsWith(github.ref, 'refs/tags/') && 'production' || 'staging') }}
  cancel-in-progress: false   # never interrupt a deployment half-way

jobs:
  resolve:
    name: Resolve target
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    outputs:
      environment: ${{ steps.r.outputs.environment }}
      tag: ${{ steps.r.outputs.tag }}
      registry: ${{ steps.r.outputs.registry }}
    steps:
      - id: r
        # User-controlled values (tag names, dispatch inputs) go through env vars, never straight into the
        # script text, and the resulting tag is validated — this prevents GitHub Actions script injection.
        env:
          EVENT: ${{ github.event_name }}
          INPUT_ENV: ${{ github.event.inputs.environment }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          PUSH_SHA: ${{ github.sha }}
          PUSH_REF: ${{ github.ref_name }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_REF: ${{ github.event.workflow_run.head_branch }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            workflow_dispatch) env="$INPUT_ENV"; sha="$PUSH_SHA"; ref="$PUSH_REF" ;;
            push)              env=production;   sha="$PUSH_SHA"; ref="$PUSH_REF" ;;
            *)                 env=staging;      sha="$RUN_SHA";  ref="$RUN_REF" ;;
          esac
          case "$env" in staging|production) ;; *) echo "invalid environment" >&2; exit 1 ;; esac
          tag="${INPUT_TAG:-}"
          [ -n "$tag" ] || tag="${ref////-}-${sha::7}"
          [[ "$tag" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "invalid image tag: $tag" >&2; exit 1; }
          echo "environment=$env" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "registry=$(echo "ghcr.io/$REPO" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy ${{ needs.resolve.outputs.tag }} -> ${{ needs.resolve.outputs.environment }}
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ needs.resolve.outputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - name: SSH setup
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      - name: Sync deployment files
        run: |
          rsync -az --delete-excluded \
            --include='docker-compose.prod.yml' --include='infrastructure/***' --exclude='*' \
            -e "ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes" \
            ./ "${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }}:${{ vars.DEPLOY_PATH }}/"
      - name: Release (blue/green, migrations first, smoke test, automatic rollback)
        run: |
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes "${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }}" \
            "cd '${{ vars.DEPLOY_PATH }}' && REGISTRY='${{ needs.resolve.outputs.registry }}' TAG='${{ needs.resolve.outputs.tag }}' \
             GRACE_SECONDS=300 ./infrastructure/scripts/deploy.sh"
      - name: External smoke test (through the public URL)
        run: |
          SMOKE_EMAIL='${{ secrets.SMOKE_EMAIL }}' SMOKE_PASSWORD='${{ secrets.SMOKE_PASSWORD }}' \
            ./infrastructure/scripts/smoke-test.sh '${{ vars.PUBLIC_BASE_URL }}'
      - name: Roll back on failure
        if: failure()
        run: |
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes "${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }}" \
            "cd '${{ vars.DEPLOY_PATH }}' && ./infrastructure/scripts/rollback.sh" || echo "rollback not needed / already rolled back"
