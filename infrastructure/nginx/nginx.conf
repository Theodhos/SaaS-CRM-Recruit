# Reference reverse-proxy config for a single-host deployment (local/staging).
# Production on managed infra (e.g. behind a cloud load balancer) may not
# need this at all — kept here as the documented fallback topology.
worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  client_max_body_size 100m; # matches STORAGE_MAX_UPLOAD_MB headroom

  # Compress text responses (API JSON lists are large and highly repetitive).
  # Responses the upstream already compressed (Content-Encoding set) are left alone.
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_proxied any;
  gzip_types application/json application/javascript text/css text/plain text/xml application/xml image/svg+xml;

  upstream web_upstream {
    server web:3000;
    keepalive 32;
  }

  upstream api_upstream {
    server api:4000;
    keepalive 32;
  }

  upstream realtime_upstream {
    server realtime:4001;
  }

  server {
    listen 80;
    server_name _;

    location /api/ {
      proxy_pass http://api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /socket.io/ {
      proxy_pass http://realtime_upstream;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
    }

    location / {
      proxy_pass http://web_upstream;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
