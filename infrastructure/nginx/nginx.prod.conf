# Production edge / load balancer.
#
#   Internet -> (Cloudflare / cloud LB, TLS) -> this nginx -> web | api (N replicas) | realtime
#
# * Upstream names are resolved through Docker's embedded DNS (127.0.0.11) at request time, so
#   `docker compose up -d --scale api=5` is picked up within `valid=` seconds — no reload needed.
#   Every replica behind the name is used (round-robin).
# * TLS is terminated in front of this proxy (Cloudflare / the cloud load balancer); this nginx speaks
#   plain HTTP on 8080 and trusts X-Forwarded-Proto from that hop.
# * Only immutable, content-hashed build assets are cached here. Anything tenant-specific (the API)
#   is never cached by the proxy.
#
# Validate a change with:  nginx -t -c /etc/nginx/nginx.conf

worker_processes auto;
worker_rlimit_nofile 65535;
pid /tmp/nginx.pid;

events {
  worker_connections 4096;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # ---- logging: one JSON object per line -> stdout, ready for Promtail/Loki -------------------------
  log_format json_combined escape=json
    '{"time":"$time_iso8601","request_id":"$request_id","remote_addr":"$remote_addr",'
    '"method":"$request_method","uri":"$request_uri","status":$status,"bytes":$body_bytes_sent,'
    '"request_time":$request_time,"upstream":"$upstream_addr","upstream_status":"$upstream_status",'
    '"upstream_time":"$upstream_response_time","user_agent":"$http_user_agent"}';
  access_log /dev/stdout json_combined;
  error_log  /dev/stderr warn;

  sendfile    on;
  tcp_nopush  on;
  tcp_nodelay on;
  server_tokens off;
  keepalive_timeout 65;
  client_max_body_size 100m; # matches STORAGE_MAX_UPLOAD_MB headroom
  client_body_temp_path /tmp/nginx-client-body;
  proxy_temp_path       /tmp/nginx-proxy;

  # ---- real client IP (needed for rate limiting and audit logs) ---------------------------------------
  # Behind Cloudflare, the socket peer is a Cloudflare address; the client is in CF-Connecting-IP.
  # cloudflare-ips.conf holds `set_real_ip_from` ranges; refresh with infrastructure/scripts/update-cloudflare-ips.sh.
  include /etc/nginx/cloudflare-ips.conf;
  real_ip_header CF-Connecting-IP;

  # ---- compression (the API's JSON lists are large and highly repetitive) ---------------------------
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_proxied any;
  gzip_types application/json application/javascript text/css text/plain text/xml application/xml image/svg+xml;

  # ---- dynamic upstream resolution ------------------------------------------------------------------
  resolver 127.0.0.11 valid=5s ipv6=off;
  resolver_timeout 3s;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
  }

  # Scheme as seen by the client: trust the edge's header, fall back to this hop's own scheme.
  map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
  }

  # Pass a request id through if the edge already set one, otherwise mint one; the API echoes it in logs.
  map $http_x_request_id $req_id {
    default $http_x_request_id;
    ''      $request_id;
  }

  # ---- rate limiting: defence in depth (the API also throttles per client) ---------------------------
  limit_req_zone  $binary_remote_addr zone=api_per_ip:20m   rate=30r/s;
  limit_req_zone  $binary_remote_addr zone=auth_per_ip:10m  rate=10r/m;
  limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;
  limit_req_status  429;
  limit_conn_status 429;

  # ---- cache for immutable, content-hashed web assets ONLY -----------------------------------------
  proxy_cache_path /tmp/nginx-cache/static levels=1:2 keys_zone=static_assets:20m max_size=1g inactive=7d use_temp_path=off;

  server {
    listen 8080 default_server;
    server_name _;

    limit_conn conn_per_ip 100;

    # Active colour for blue/green releases (see docker-compose.prod.yml, infrastructure/scripts/deploy.sh).
    include /etc/nginx/active-color.conf;

    # Defaults shared by every proxied location.
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $fwd_proto;
    proxy_set_header X-Request-Id      $req_id;
    proxy_hide_header X-Powered-By;
    proxy_connect_timeout 3s;
    # Retry on another replica ONLY for connection errors / 502-504. nginx never retries POST/PATCH by
    # default, so a non-idempotent write cannot be applied twice.
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 2;
    proxy_next_upstream_timeout 10s;

    # Load-balancer's own liveness (used by the cloud LB / uptime checks; does not touch upstreams).
    location = /lb-health {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    # ---- API ---------------------------------------------------------------------------------------
    # Auth endpoints: much tighter (credential stuffing).
    location ~ ^/api/v1/auth/(login|register|forgot-password|reset-password|refresh)$ {
      limit_req zone=auth_per_ip burst=10 nodelay;
      proxy_read_timeout 30s;
      proxy_pass http://$api_host:4000;
    }

    location /api/ {
      limit_req zone=api_per_ip burst=120 nodelay;
      proxy_read_timeout 120s; # CV parsing / large exports
      proxy_pass http://$api_host:4000;
    }

    # Health of the API tier as seen through the LB (kept off the rate limiter).
    location = /health {
      access_log off;
      proxy_pass http://$api_host:4000;
    }
    location = /health/ready {
      access_log off;
      proxy_pass http://$api_host:4000;
    }

    # ---- realtime (WebSocket) -------------------------------------------------------------------
    # With more than one realtime replica, configure the client for `transports: ['websocket']`
    # (no sticky sessions needed) or front this with a sticky LB; the Redis adapter fans events out.
    location /socket.io/ {
      set $realtime_host realtime; # variable => resolved at request time, so the edge boots even if realtime is down
      proxy_pass http://$realtime_host:4001;
      proxy_set_header Upgrade    $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    # ---- web ---------------------------------------------------------------------------------------
    # Hashed build output: safe to cache for a year at the proxy and in browsers.
    location /_next/static/ {
      proxy_pass http://$web_host:3000;
      proxy_cache static_assets;
      proxy_cache_valid 200 365d;
      proxy_cache_lock on;
      proxy_ignore_headers Set-Cookie;
      proxy_hide_header Set-Cookie;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      add_header X-Cache-Status $upstream_cache_status always;
    }

    location / {
      proxy_pass http://$web_host:3000;
      proxy_read_timeout 60s;
    }
  }
}
