# Prometheus: scrapes the API replicas, the workers, Redis, PostgreSQL, the containers and the host, and
# probes the public endpoints from the outside (blackbox).
#
# Replicas are discovered through Docker's DNS (a service name resolves to every replica), so
# `docker compose up -d --scale api-blue=5` needs no config change. A colour that is stopped simply
# resolves to nothing.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    system: crm

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: crm-api
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/secrets/metrics_token
    dns_sd_configs:
      - names: [api-blue, api-green]
        type: A
        port: 4000
        refresh_interval: 15s
    relabel_configs:
      - source_labels: [__meta_dns_name]
        target_label: colour
        regex: api-(.*)
      - source_labels: [__address__]
        target_label: instance

  - job_name: crm-worker
    dns_sd_configs:
      - names: [worker]
        type: A
        port: 9464            # WORKER_METRICS_PORT
        refresh_interval: 15s

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]
        labels: { redis: queues }
      - targets: ["redis-cache-exporter:9121"]
        labels: { redis: cache }

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: containers
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: host
    static_configs:
      - targets: ["node-exporter:9100"]

  # Black-box probes: is the platform reachable, and how fast, from the user's side of the edge?
  - job_name: probe-http
    metrics_path: /probe
    params: { module: [http_2xx] }
    static_configs:
      - targets:
          - http://edge:8080/lb-health
          - http://edge:8080/health/ready
          - http://edge:8080/login
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
