# Alertmanager: routes alerts to people. Secrets are read from files (mounted from ./secrets/, which is
# git-ignored) because Alertmanager does not expand environment variables in this file.
#
#   secrets/slack_webhook_url         Slack incoming-webhook URL (or replace the receiver with PagerDuty / e-mail)
#   secrets/smtp_password             only if you enable the e-mail receiver below
global:
  resolve_timeout: 5m
  slack_api_url_file: /etc/alertmanager/secrets/slack_webhook_url

route:
  receiver: team-warnings
  group_by: [alertname, instance]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: [severity="critical"]
      receiver: team-critical
      group_wait: 10s
      repeat_interval: 1h

receivers:
  - name: team-critical
    slack_configs:
      - channel: "#crm-alerts-critical"
        send_resolved: true
        title: ":rotating_light: {{ .CommonLabels.alertname }} ({{ .Status }})"
        text: |-
          {{ range .Alerts }}*{{ .Annotations.summary }}*
          {{ if .Annotations.runbook }}Runbook: {{ .Annotations.runbook }}{{ end }}
          {{ end }}
    # Page someone as well — uncomment and create secrets/pagerduty_key:
    # pagerduty_configs:
    #   - routing_key_file: /etc/alertmanager/secrets/pagerduty_key

  - name: team-warnings
    slack_configs:
      - channel: "#crm-alerts"
        send_resolved: true
        title: ":warning: {{ .CommonLabels.alertname }} ({{ .Status }})"
        text: "{{ range .Alerts }}{{ .Annotations.summary }}\n{{ end }}"

inhibit_rules:
  # A dead platform makes every symptom alert redundant.
  - source_matchers: [alertname="PlatformUnreachable"]
    target_matchers: [severity="warning"]
    equal: [system]
  - source_matchers: [alertname="PostgresDown"]
    target_matchers: [alertname=~"HighErrorRate|SlowApiP95|SlowApiP99"]
    equal: [system]
